name: ci
on:
  push: { paths: ["ui/**"] }
  pull_request: { paths: ["ui/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: pip install -e . pytest ruff
      - name: ruff
        run: ruff check anima_thor_ui scripts tests
      - name: unit tests (pure logic — no engine/GPU)
        run: python -m pytest tests/ -q
