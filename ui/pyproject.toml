[project]
name = "anima-thor-ui"
version = "0.1.0"
description = "ANIMA Thor UI — control plane for the anima-vllm:thor-latest engine on NVIDIA Jetson AGX Thor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "huggingface-hub>=0.27",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[project.scripts]
anima-thor-ui = "anima_thor_ui.main:run"

[tool.ruff]
line-length = 110
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anima_thor_ui"]
